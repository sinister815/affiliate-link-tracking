name: Run Audit Worker

on:
  workflow_dispatch:
  workflow_call:

jobs:
  process-queue:
    runs-on: self-hosted
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check environment
        run: |
          Write-Host "Node version:"
          node --version

          Write-Host "NPM version:"
          npm --version

          Write-Host "Working directory:"
          Get-Location

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Puppeteer browser
        working-directory: backend
        run: npx puppeteer browsers install chrome
        env:
          PUPPETEER_CACHE_DIR: "${{ runner.temp }}/puppeteer"

      - name: Verify Redis connectivity
        working-directory: backend
        run: |
          node -e "
            const IORedis = require('ioredis');
            const redis = new IORedis(process.env.REDIS_URL, {
              connectTimeout: 10000,
              enableReadyCheck: true,
              tls: (process.env.REDIS_URL || '').startsWith('rediss://') ? {} : undefined,
              maxRetriesPerRequest: 1,
              retryStrategy(times) { return Math.min(times * 200, 3000); }
            });
            redis.on('ready', async () => {
              console.log('✅ Redis is reachable');
              const pong = await redis.ping();
              console.log('PING →', pong);
              await redis.quit();
              process.exit(0);
            });
            redis.on('error', (err) => {
              console.error('❌ Redis check failed:', err.message);
              process.exit(1);
            });
          "
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Process audit queue
        working-directory: backend
        run: node src/worker.js
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          WORKER_CONCURRENCY: 2
          PUPPETEER_CACHE_DIR: "${{ runner.temp }}/puppeteer"
