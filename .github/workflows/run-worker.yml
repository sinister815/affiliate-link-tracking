name: Run Audit Worker

on:
  workflow_dispatch:
  workflow_call:

jobs:
  process-queue:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: bash          # use Git Bash instead of PowerShell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install Puppeteer browser
        run: cd backend && npx puppeteer browsers install chrome
        env:
          PUPPETEER_CACHE_DIR: /tmp/.puppeteer

      - name: Process audit queue
        run: cd backend && node src/worker.js
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          WORKER_CONCURRENCY: 2
          PUPPETEER_CACHE_DIR: /tmp/.puppeteer
