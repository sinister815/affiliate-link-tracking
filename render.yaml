services:
  # ── API Server ─────────────────────────────────────────────────────────────
  - type: web
    name: bot-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /api/audit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: bot-redis
          type: redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: bot-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: bot-redis
          type: redis
          property: port
      # GitHub Actions trigger — worker runs on self-hosted runner, not Render
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_REPO_OWNER
        sync: false
      - key: GITHUB_REPO_NAME
        sync: false

  # ── Managed Redis ──────────────────────────────────────────────────────────
  - type: redis
    name: bot-redis
    plan: starter
    ipAllowList: []
